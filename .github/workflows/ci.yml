name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # evals/ cases pin real commits
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test
